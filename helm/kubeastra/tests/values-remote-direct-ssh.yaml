# Phase 6 render fixture: direct-SSH remote diagnostics.
# Run: helm template test . -f tests/values-remote-direct-ssh.yaml
# Verifies the ConfigMap and Deployment mounts render for a single QA target.
networkPolicy:
  enabled: true
  mode: enforce-all
  ingressCidrs: [10.0.0.0/8]
  kubernetesApiCidrs: [10.99.0.1/32]

remoteDiagnostics:
  enabled: true
  timeouts:
    connectionSeconds: "10"
    diagnosticPhaseSeconds: "30"
  targets:
    qa17:
      enabled: true
      display_name: QA 17
      environment_group: qa
      connection:
        type: ssh
        host: 10.40.17.10
        port: 22
        username: k8s-diagnostics
        known_hosts_alias: qa17-control-plane
      expected_kube_system_uid: 1c43dff0-0000-0000-0000-000000000001
      diagnostic_scopes_allowed: [kubernetes]
      allowed_caller_scopes: [qa-ansible]
      credentialSecretRef:
        name: agent-target-qa17-credentials
  callerScopes:
    qa-ansible:
      allowed_target_ids: [qa17]
      tokenSecretRef:
        name: agent-caller-token-qa-ansible
      currentTokenKey: current
      previousTokenKey: previous
  knownHostsEntries:
    - "qa17-control-plane ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI-example-key-do-not-use"
  network:
    targetEgress:
      - cidr: 10.40.17.0/24
        ports: [22]
