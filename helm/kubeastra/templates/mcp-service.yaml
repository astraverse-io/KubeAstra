{{/*
HTTP MCP server service — port 8001.

Use type: NodePort or LoadBalancer to let Cursor / Claude Desktop / other MCP
clients connect directly to the MCP server from outside the cluster.

The MCP server uses Streamable HTTP (SSE). On GKE, the default proxy-based
Internal LB buffers SSE responses, causing MCP clients to hang. The values
include cloud.google.com/l4-rbs: "enabled" to create a passthrough Network LB
that does not buffer streaming responses.

Cursor config (after exposing externally):
  "mcpServers": {
    "k8s-devops": {
      "type": "http",
      "url": "http://<ilb-ip>:8001/mcp/",
      "headers": { "Authorization": "Bearer <mcpAuthToken>" }
    }
  }
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeastra.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  {{- with .Values.mcp.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mcp.service.type }}
  {{- if eq .Values.mcp.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    {{- include "kubeastra.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.mcp.service.port }}
      targetPort: mcp
      protocol: TCP
      {{- if and (eq .Values.mcp.service.type "NodePort") .Values.mcp.service.nodePort }}
      nodePort: {{ .Values.mcp.service.nodePort }}
      {{- end }}
