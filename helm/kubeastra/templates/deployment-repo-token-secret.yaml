{{/*
Templated Secret for the deployment-repo GitHub PAT.

Rendered ONLY when:
  - deploymentRepo.enabled = true, AND
  - deploymentRepo.token   is set (non-empty)

If the user prefers to manage the Secret externally (sealed-secrets,
external-secrets-operator, Vault, hand-rolled kubectl create), they
should leave deploymentRepo.token empty and instead create a Secret
named ``deploymentRepo.tokenSecretName`` themselves. The CronJob
template references that name in either case, so the consumer side
doesn't change.

Standard warning: putting a PAT inline in values.yaml is convenient but
means the file must NOT be committed to git. Use --set on helm install/
upgrade or a gitignored values-secrets.yaml.
*/}}
{{- if and .Values.deploymentRepo.enabled .Values.deploymentRepo.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.deploymentRepo.tokenSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: deployment-repo-token
  annotations:
    # Marker so operators can tell at a glance this Secret is chart-managed
    # vs. created by hand or another tool.
    kubeastra/managed-by-chart: "true"
type: Opaque
data:
  {{ .Values.deploymentRepo.tokenSecretKey | default "token" }}: {{ .Values.deploymentRepo.token | b64enc | quote }}
{{- end }}
