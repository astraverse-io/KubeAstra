{{- $alertWebhookToken := include "kubeastra.alertWebhookToken" . -}}
{{- if or .Values.secrets.geminiApiKey .Values.secrets.kubeconfig .Values.secrets.mcpAuthToken $alertWebhookToken .Values.secrets.agentApiToken .Values.agentHarness.tracePersistence.retentionEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeastra.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeastra.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.kubeconfig }}
  # kubeconfig — mounted as a file at /app/kubeconfig/config
  config: {{ .Values.secrets.kubeconfig | quote }}
  {{- end }}
  {{- if .Values.secrets.mcpAuthToken }}
  # MCP_AUTH_TOKEN — bearer token for the HTTP MCP server (port 8001)
  MCP_AUTH_TOKEN: {{ .Values.secrets.mcpAuthToken | b64enc | quote }}
  {{- end }}
  {{- if $alertWebhookToken }}
  # ALERT_WEBHOOK_TOKEN — bearer token Alertmanager/Grafana must present when
  # POSTing to /api/v1/alerts/webhook. Auto-resolved from .Release.Namespace
  # via the kubeastra.alertWebhookToken helper (see _helpers.tpl);
  # the value comes from secrets.alertWebhookToken_{Dev,Prod} or the explicit
  # alertWebhookToken / alertWebhookTokensByNamespace fields in values.
  ALERT_WEBHOOK_TOKEN: {{ $alertWebhookToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.agentApiToken }}
  AGENT_API_TOKEN: {{ .Values.secrets.agentApiToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.agentApiTokenPrevious }}
  AGENT_API_TOKEN_PREVIOUS: {{ .Values.secrets.agentApiTokenPrevious | b64enc | quote }}
  {{- end }}
  {{- if .Values.agentHarness.tracePersistence.retentionEnabled }}
  # PRUNE_TOKEN — internal auth token for daily runs/steps pruning
  PRUNE_TOKEN: {{ if .Values.secrets.pruneToken }}{{ .Values.secrets.pruneToken | b64enc | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
  {{- end }}
{{- end }}
