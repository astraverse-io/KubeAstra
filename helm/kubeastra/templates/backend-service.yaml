{{- $serviceType := include "kubeastra.backendServiceType" . }}
{{- $annotations := include "kubeastra.backendServiceAnnotations" . | trim }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeastra.backendServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ $serviceType }}
  {{- $lbIp := include "kubeastra.loadBalancerIP" (dict "ctx" . "perService" .Values.backend.service.loadBalancerIP) }}
  {{- with $lbIp }}
  loadBalancerIP: {{ . }}
  {{- end }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kubeastra.backend.selectorLabels" . | nindent 4 }}
