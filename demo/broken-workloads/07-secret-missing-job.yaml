# demo/broken-workloads/07-secret-missing-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: backup-reporting-job
  namespace: demo
  labels:
    app: backup-reporter
    tier: batch
    scenario: CreateContainerConfigError
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: backup-reporter
    spec:
      restartPolicy: OnFailure
      containers:
      - name: reporter
        image: alpine:latest
        command: ["sh", "-c", "echo 'Generating nightly report...' && exit 0"]
        env:
        - name: DATABASE_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: does-not-exist
              key: private-key