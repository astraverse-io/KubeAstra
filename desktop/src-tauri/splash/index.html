<!DOCTYPE html>
<!--
  What the window shows before the backend is reachable.

  This is `frontendDist`. It is deliberately NOT the Next export: the webview
  is navigated to http://127.0.0.1:<port>/ as soon as the backend answers
  /health, so the export was only ever the first frame — and bundling it here
  duplicated ~20 MB that the PyInstaller sidecar already carries.

  It is also where startup failures surface. Before this existed, a sidecar
  that could not start left the window blank forever with the reason only on
  stderr, which is how a bundle whose backend never ran got as far as a .dmg.

  Plain HTML and CSS on purpose: no framework, no fetch, nothing that can
  itself fail while it is explaining a failure.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KubeAstra</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #fbfbfd;
        color: #1d1d1f;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #161618; color: #f5f5f7; }
      }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .5rem; }
      p { margin: 0; opacity: .7; }
      pre {
        margin: 1.25rem 0 0;
        padding: .85rem 1rem;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        border-radius: 8px;
        background: rgba(127, 127, 127, .12);
      }
      .spinner {
        width: 22px; height: 22px; margin: 0 auto 1.1rem;
        border: 2px solid rgba(127, 127, 127, .28);
        border-top-color: #0071e3;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      [data-state="error"] .spinner { display: none; }
      [data-state="error"] h1 { color: #d70015; }
      @media (prefers-color-scheme: dark) {
        [data-state="error"] h1 { color: #ff6961; }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <main id="root">
      <div class="spinner"></div>
      <h1 id="headline">Starting KubeAstra…</h1>
      <p id="detail">Waiting for the local backend.</p>
    </main>
    <script src="boot.js" defer></script>
  </body>
</html>
