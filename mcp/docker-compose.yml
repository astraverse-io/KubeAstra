# Local Qdrant for RAG development.
#
#   make docker-up   → starts Qdrant on http://localhost:6333
#   make seed        → loads ~60 sample errors via data/seed.py
#
# Production deployment lives in helm/kubeastra/templates/qdrant-*.yaml
# (StatefulSet with PVC + ClusterIP service).
services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"   # HTTP API (used by qdrant-client by default)
      - "6334:6334"   # gRPC API (optional)
    environment:
      QDRANT__LOG_LEVEL: INFO
      # Keep dev frictionless: anonymous access OK. Production sets
      # QDRANT__SERVICE__API_KEY (see Helm chart).
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
