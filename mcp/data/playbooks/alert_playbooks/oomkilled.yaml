id: oomkilled
version: "1.1"
display_name: OOMKilled and Memory Termination Investigation
includes:
  - branches/pod_health_baseline.yaml
  - branches/pvc_mount_blockers.yaml
  - branches/oom_memory_termination.yaml
supported_alerts:
  - pattern: MEMORY_PRESSURE
    fields: [classification.category]
  - pattern: OOMKilled, exit 137, out of memory, memory pressure, or memory limit exhaustion
    fields: [name, labels.alertname, labels.reason, labels.exit_code, labels.condition, annotations.summary]
allowed_tools:
  - describe_pod
  - describe_pod_pvcs
  - get_events
  - get_pod_logs
  - investigate_pod
  - prom_query
safety:
  readonly: true
  max_steps: 7
  blocked_verbs: [create, update, patch, delete, scale, restart, exec]
llm_policy:
  mode: advisory_only
  require_structured_output: true
  may_select_tools_only_from_allowed_tools: true
steps:
  - id: run_existing_pod_investigation
    tool: investigate_pod
    description: Composite pod investigation — auto-selects the failing container and collects describe/current+previous logs/events/per-container findings before the LLM steers.
    deterministic: true
    args:
      namespace: "{{ alert.labels.namespace }}"
      pod_name: "{{ alert.labels.pod }}"
      tail: 200
      use_ai: true
remediation_mappings:
  OOMKilled:
    - Compare memory usage against requests and limits.
    - Check whether the pod hit its container memory limit or the node was under MemoryPressure.
    - Inspect previous logs for runtime OOM, WAL replay, TSDB compaction, Loki chunk flush backlog, or storage timeout clues.
    - Investigate PVC/storage backend only when logs or events point to WAL, chunks, mmap, fsync, Longhorn, Ceph, or object-store latency.
stop_conditions:
  max_confidence: 0.85
  max_steps_reached: true
  root_cause_identified: true
