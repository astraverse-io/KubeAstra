id: deployment-liveness-probe-wrong-port
symptom: >-
  The pod restarts in a loop. The liveness probe checks port 80 but the app
  serves health on 8080, so every probe fails and the kubelet kills it.
kind: Deployment
checks:
  - path: spec.template.spec.containers[0].livenessProbe.httpGet.port
    equals: 8080
broken: |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api
    namespace: apps
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: api
    template:
      metadata:
        labels:
          app: api
      spec:
        containers:
          - name: api
            image: ghcr.io/acme/api:2.1.0
            ports:
              - containerPort: 8080
            livenessProbe:
              httpGet:
                path: /healthz
                port: 80
fixed: |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api
    namespace: apps
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: api
    template:
      metadata:
        labels:
          app: api
      spec:
        containers:
          - name: api
            image: ghcr.io/acme/api:2.1.0
            ports:
              - containerPort: 8080
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8080
