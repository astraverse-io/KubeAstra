id: deployment-missing-memory-limit
symptom: >-
  The container is repeatedly OOMKilled under load. It has no memory limit, so
  it is scheduled without a cap and the node reaps it. Add a memory limit.
kind: Deployment
checks:
  - path: spec.template.spec.containers[0].resources.limits.memory
    exists: true
broken: |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api
    namespace: apps
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: api
    template:
      metadata:
        labels:
          app: api
      spec:
        containers:
          - name: api
            image: ghcr.io/acme/api:2.1.0
fixed: |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api
    namespace: apps
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: api
    template:
      metadata:
        labels:
          app: api
      spec:
        containers:
          - name: api
            image: ghcr.io/acme/api:2.1.0
            resources:
              limits:
                memory: 256Mi
              requests:
                memory: 128Mi
