[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeastra"
version = "0.2.3"
description = "CLI for KubeAstra — AI-powered Kubernetes troubleshooting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "KubeAstra contributors" },
]
keywords = ["kubernetes", "k8s", "ai", "troubleshooting", "kubectl", "sre", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    # Python 3.11 std lib has tomllib for READING; we need tomli-w to WRITE.
    "tomli-w>=1.0.0",
    # The `upgrade` subcommand loads the pure planner core (services.upgrade),
    # which parses manifests with PyYAML. Without it the core import fails and
    # `kubeastra upgrade` can't run from an installed package.
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-httpx>=0.30.0",
    "syrupy>=4.6.0",
]

[project.urls]
Homepage = "https://kubeastra.io"
Repository = "https://github.com/astraverse-io/KubeAstra"
Issues = "https://github.com/astraverse-io/KubeAstra/issues"

[project.scripts]
kubeastra = "kubeastra.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# The pure Pilot cores (upgrade, resilience) + their data are copied into
# kubeastra/_vendor by cli/scripts/vendor_core.py before every build (they live
# in mcp/, outside this project). The .py files are found as packages; the YAML
# data files need declaring. MANIFEST.in carries both into the sdist, which is what
# `python -m build` turns into the wheel.
[tool.setuptools.package-data]
kubeastra = ["_vendor/data/upgrades/*.yaml", "_vendor/data/resilience/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
