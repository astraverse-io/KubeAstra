[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeastra"
version = "0.1.0"
description = "CLI for KubeAstra — AI-powered Kubernetes troubleshooting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "KubeAstra contributors" },
]
keywords = ["kubernetes", "k8s", "ai", "troubleshooting", "kubectl", "sre", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    # Python 3.11 std lib has tomllib for READING; we need tomli-w to WRITE.
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-httpx>=0.30.0",
    "syrupy>=4.6.0",
]

[project.urls]
Homepage = "https://kubeastra.io"
Repository = "https://github.com/astraverse-io/KubeAstra"
Issues = "https://github.com/astraverse-io/KubeAstra/issues"

[project.scripts]
kubeastra = "kubeastra.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
