name: VS Code Extension

# Builds and tests the KubeAstra VS Code extension on every push to the feature
# branch and on PRs that touch it, and publishes to the VS Code Marketplace and
# OpenVSX when a vscode-v* tag is pushed (e.g. vscode-v0.1.0).
#
# One-time setup required before the first publish:
#   1. Create an Azure DevOps publisher named "astraverse-io" and generate a
#      Marketplace PAT; store it as the repo secret VSCE_PAT.
#      https://code.visualstudio.com/api/working-with-extensions/publishing-extension
#   2. Create an open-vsx.org namespace "astraverse-io" and an access token;
#      store it as the repo secret OVSX_PAT.
#   3. Add both secrets to the "vscode-marketplace" environment below.
# Until those exist the build-test job still runs; only publish is gated.

on:
  push:
    branches: [feat/vscode]
    tags: ["vscode-v*"]
  pull_request:
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: extensions/vscode

jobs:
  build-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix webview

      - name: Typecheck + build (host + webview)
        run: |
          npm run typecheck
          npm run build
          npm run build:webview

      - name: Webview unit tests (vitest)
        run: npm test --prefix webview

      - name: Extension activation test (@vscode/test-electron)
        run: xvfb-run -a npm test

  publish:
    name: Publish to Marketplace + OpenVSX
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix webview

      - name: Package .vsix
        run: npm run package # vsce package runs the vscode:prepublish build

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath kubeastra-vscode.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to OpenVSX
        run: npx ovsx publish kubeastra-vscode.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeastra-vscode-vsix
          path: extensions/vscode/kubeastra-vscode.vsix
