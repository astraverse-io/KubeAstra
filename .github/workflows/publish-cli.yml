name: Publish CLI to PyPI

# Builds the `kubeastra` CLI sdist + wheel and publishes to PyPI whenever a
# cli-v* tag is pushed (e.g. cli-v0.1.0). Uses PyPI Trusted Publishing (OIDC)
# — no long-lived API token stored in repo secrets.
#
# One-time setup required on pypi.org before the first run:
#   1. Create the "kubeastra" project (or add a pending publisher if it
#      doesn't exist yet) at https://pypi.org/manage/account/publishing/
#   2. Publisher: GitHub — owner=<org>, repo=<this repo>,
#      workflow=publish-cli.yml, environment=pypi

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        working-directory: cli
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: cli/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
