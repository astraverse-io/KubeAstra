name: CI

# `feat/desktop` is here for the same reason it is in codeql.yml: multi-phase
# work lands on a long-lived integration branch (CLAUDE.md § "Multi-phase work
# stays off main"), so most pull requests target it rather than `main`. With
# only `main` listed, five of the last six pull requests merged without CI
# running at all — the suite went green on somebody's laptop or not at all, and
# the first real run was the eventual merge to `main`, by which point a
# bisect spans a phase of work instead of a commit.
on:
  push:
    branches: [main, feat/desktop]
  pull_request:
    branches: [main, feat/desktop]

jobs:
  python-build:
    name: Python compile + import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MCP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r ui/backend/requirements.txt

      - name: Compile MCP package
        run: |
          python -m compileall -q mcp

      - name: Compile backend package
        run: |
          python -m compileall -q ui/backend

      - name: Import smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/mcp
        run: |
          python -c "from mcp_server import tools; print(f'Tools registered: OK')"
          python -c "from k8s import wrappers; print('Wrappers import: OK')"
          python -c "from services.llm import get_provider; print('LLM provider factory: OK')"

  cli-build:
    name: CLI install + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CLI (editable) + dev extras
        working-directory: cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI smoke — --version + --help
        run: |
          kubeastra --version
          kubeastra --help

      - name: pytest (CLI smoke tests)
        working-directory: cli
        run: |
          python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install
        working-directory: ui/frontend
        run: npm ci

      - name: Type-check
        working-directory: ui/frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: ui/frontend
        run: npm run build
