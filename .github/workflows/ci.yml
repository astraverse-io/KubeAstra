name: CI

# `feat/desktop` is here for the same reason it is in codeql.yml: multi-phase
# work lands on a long-lived integration branch (CLAUDE.md § "Multi-phase work
# stays off main"), so most pull requests target it rather than `main`. With
# only `main` listed, five of the last six pull requests merged without CI
# running at all — the suite went green on somebody's laptop or not at all, and
# the first real run was the eventual merge to `main`, by which point a
# bisect spans a phase of work instead of a commit.
on:
  push:
    branches: [main, feat/desktop, feat/windows]
  pull_request:
    branches: [main, feat/desktop, feat/windows]

# Least privilege for the automatic GITHUB_TOKEN. Without this the token
# inherits the repository default, which on many repos is write — and these
# workflows run code from pull requests. They only ever need to read the
# tree, so say so rather than relying on a repo setting that can change
# without anyone editing this file.
#
# Exactly one of these. `main` and `feat/desktop` each added the block
# independently, at different offsets, so the merge took both without a
# conflict — and a duplicate top-level key makes the workflow unloadable.
# GitHub reported that as a run that failed in 0s with no jobs, which reads
# like a flake rather than a syntax error, and `feat/desktop` went without any
# CI at all until someone opened a run and noticed it had nothing in it.
permissions:
  contents: read

jobs:
  python-build:
    name: Python compile + import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MCP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r ui/backend/requirements.txt

      - name: Compile MCP package
        run: |
          python -m compileall -q mcp

      - name: Compile backend package
        run: |
          python -m compileall -q ui/backend

      - name: Import smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/mcp
        run: |
          python -c "from mcp_server import tools; print(f'Tools registered: OK')"
          python -c "from k8s import wrappers; print('Wrappers import: OK')"
          python -c "from services.llm import get_provider; print('LLM provider factory: OK')"

  # The suite above installs dependencies from the repo tree, where relative
  # `-r` includes resolve. The Dockerfile copies requirements files elsewhere,
  # where they may not — which is exactly how the backend image failed to
  # build on every push to `main` from 2026-07-29 to 2026-08-06 while CI stayed
  # green. Nothing built the image until release.yml did, on `main`, after the
  # merge, where a red X is easy to scroll past.
  #
  # This builds both images without pushing, so the artifact people actually
  # deploy is checked before the merge rather than after it.
  image-build:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ui/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ui/frontend
          file: ui/frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli-build:
    name: CLI install + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CLI (editable) + dev extras
        working-directory: cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI smoke — --version + --help
        run: |
          kubeastra --version
          kubeastra --help

      - name: pytest (CLI smoke tests)
        working-directory: cli
        run: |
          python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install
        working-directory: ui/frontend
        run: npm ci

      - name: Type-check
        working-directory: ui/frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: ui/frontend
        run: npm run build
